name: Deploy Application

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Lint and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: |
          set -euo pipefail
          ruff check .

      - name: Pytest
        run: |
          set -euo pipefail
          pytest

  deploy:
    name: Deploy to Controller
    runs-on: [self-hosted, Linux, X64, reml]
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync repository locally via rsync
        env:
          REML_APP_DIR: ${{ secrets.REML_APP_DIR }}
        run: |
          set -euo pipefail
          mkdir -p "$REML_APP_DIR"
          rsync -az --delete \
            --exclude ".git/" \
            --exclude "__pycache__/" \
            --exclude ".venv/" \
            --exclude ".pytest_cache/" \
            ./ "$REML_APP_DIR/"

      - name: Install app dependencies, run DB init, restart services
        env:
          REML_APP_DIR: ${{ secrets.REML_APP_DIR }}
          REML_DB_DSN: ${{ secrets.REML_DB_DSN }}
          SOURCE_API_LOGIN: ${{ secrets.SOURCE_API_LOGIN }}
          SOURCE_API_TOKEN: ${{ secrets.SOURCE_API_TOKEN }}
          SOURCE_API_ENDPOINT: ${{ secrets.SOURCE_API_ENDPOINT }}
          SOURCE_API_TIMEOUT_SECONDS: ${{ secrets.SOURCE_API_TIMEOUT_SECONDS }}
          SOURCE_API_MAX_RETRIES: ${{ secrets.SOURCE_API_MAX_RETRIES }}
        run: |
          set -euo pipefail
          export REML_DB_DSN="$REML_DB_DSN"
          export SOURCE_API_LOGIN="$SOURCE_API_LOGIN"
          export SOURCE_API_TOKEN="$SOURCE_API_TOKEN"
          export SOURCE_API_ENDPOINT="${SOURCE_API_ENDPOINT:-}"
          export SOURCE_API_TIMEOUT_SECONDS="${SOURCE_API_TIMEOUT_SECONDS:-}"
          export SOURCE_API_MAX_RETRIES="${SOURCE_API_MAX_RETRIES:-}"
          cd "$REML_APP_DIR"
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -U pip
          pip install -r requirements.txt
          python scripts/init_db.py
          sudo systemctl restart prefect || true
          sudo systemctl restart mlflow || true

      - name: Post-deploy smoke checks
        env:
          REML_APP_DIR: ${{ secrets.REML_APP_DIR }}
          REML_DB_DSN: ${{ secrets.REML_DB_DSN }}
        run: |
          set -euo pipefail
          cd "$REML_APP_DIR"
          . .venv/bin/activate
          python - <<'PY'
          import os
          import psycopg
          import reml  # noqa: F401

          dsn = os.environ["REML_DB_DSN"]
          required_tables = [
              "sale.listing_api_responses",
              "sale.listing_objects",
              "sale.listing_price_observations",
              "rent.listing_api_responses",
              "rent.listing_objects",
              "rent.listing_price_observations",
              "public.ingestion_backfill_checkpoints",
          ]

          with psycopg.connect(dsn) as conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT 1")
                  assert cur.fetchone() == (1,)
                  for table_name in required_tables:
                      cur.execute(
                          "SELECT to_regclass(%s)",
                          (table_name,),
                      )
                      result = cur.fetchone()
                      if result is None or result[0] is None:
                          raise RuntimeError(f"Missing required table: {table_name}")

          print("Smoke checks passed: import, DB connection, required tables")
          PY
